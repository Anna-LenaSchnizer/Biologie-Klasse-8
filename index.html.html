<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blutzucker-Simulation</title>
<style>
/* Layout: eine Spalte, Steuerung oben, Körper-Schema, Verlaufskurve darunter */
:root{
  --bg:#fbfaf7;--text-primary:#1c2230;--text-secondary:#555d70;--text-muted:#7a8194;
  --card:#ffffff;--border:#dedbd3;--border-strong:#b9b5aa;--bg-neutral:#efede7;--radius:8px;
  --bg-accent:#dfe8fb;--text-accent:#1f48a8;--border-accent:#7f9be0;
  --bg-success:#ddf1e3;--text-success:#1b5a31;
  --bg-warning:#fbe8c4;--text-warning:#6b4306;
  --bg-danger:#fbdada;--text-danger:#7d1c1c;
  --pu-f:#eeedfe;--pu-s:#534ab7;--pu-t:#3c3489;
  --te-f:#e1f5ee;--te-s:#0f6e56;--te-t:#085041;
  --gr-f:#f1efe8;--gr-s:#888780;--gr-t:#444441;
  --co-f:#faece7;--co-s:#993c1d;--co-t:#712b13;
  --re-f:#fcebeb;--re-s:#a32d2d;--re-t:#791f1f;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171f;--text-primary:#eceef4;--text-secondary:#a7aebf;--text-muted:#838ba0;
  --card:#1c202b;--border:#333948;--border-strong:#4d556a;--bg-neutral:#232836;
  --bg-accent:#223566;--text-accent:#b5c8f7;--border-accent:#5573c0;
  --bg-success:#1b3b27;--text-success:#a9e0bb;
  --bg-warning:#4a3511;--text-warning:#f3d390;
  --bg-danger:#4a1d1d;--text-danger:#f5b5b5;
  --pu-f:#3c3489;--pu-s:#afa9ec;--pu-t:#cecbf6;
  --te-f:#085041;--te-s:#5dcaa5;--te-t:#9fe1cb;
  --gr-f:#3a3a37;--gr-s:#b4b2a9;--gr-t:#d3d1c7;
  --co-f:#712b13;--co-s:#f0997b;--co-t:#f5c4b3;
  --re-f:#4a1b1b;--re-s:#f09595;--re-t:#f7c1c1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171f;--text-primary:#eceef4;--text-secondary:#a7aebf;--text-muted:#838ba0;
  --card:#1c202b;--border:#333948;--border-strong:#4d556a;--bg-neutral:#232836;
  --bg-accent:#223566;--text-accent:#b5c8f7;--border-accent:#5573c0;
  --bg-success:#1b3b27;--text-success:#a9e0bb;
  --bg-warning:#4a3511;--text-warning:#f3d390;
  --bg-danger:#4a1d1d;--text-danger:#f5b5b5;
  --pu-f:#3c3489;--pu-s:#afa9ec;--pu-t:#cecbf6;
  --te-f:#085041;--te-s:#5dcaa5;--te-t:#9fe1cb;
  --gr-f:#3a3a37;--gr-s:#b4b2a9;--gr-t:#d3d1c7;
  --co-f:#712b13;--co-s:#f0997b;--co-t:#f5c4b3;
  --re-f:#4a1b1b;--re-s:#f09595;--re-t:#f7c1c1;
  color-scheme:dark}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
.lead{margin:0;color:var(--text-secondary);font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .sp{flex:1 1 0;min-width:0}
button{font:inherit;font-size:15px;color:var(--text-primary);background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;min-height:44px;cursor:pointer}
button:hover{background:var(--bg-neutral)}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--text-accent);outline-offset:2px}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}
@media (max-width:520px){.top{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--bg-neutral);border-radius:var(--radius);padding:12px 16px;min-width:0}
.tile small{display:block;font-size:13px;color:var(--text-secondary)}
.tile .num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .num span{font-size:13px;font-weight:400;color:var(--text-secondary)}
#badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:var(--radius);margin-top:4px;background:var(--bg-success);color:var(--text-success)}
#msg{display:flex;align-items:center;font-size:16px;line-height:1.45}
svg{display:block;width:100%;height:auto;max-width:100%}
svg text{font-family:var(--font)}
.t{font-size:14px;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.th{font-size:14px;font-weight:700;fill:var(--text-primary)}
.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3}
.c-purple{fill:var(--pu-f);stroke:var(--pu-s)}.c-purple .th{fill:var(--pu-t)}.c-purple .ts{fill:var(--pu-s)}
.c-teal{fill:var(--te-f);stroke:var(--te-s)}.c-teal .th{fill:var(--te-t)}.c-teal .ts{fill:var(--te-s)}
.c-gray{fill:var(--gr-f);stroke:var(--gr-s)}.c-gray .th{fill:var(--gr-t)}.c-gray .ts{fill:var(--gr-s)}
.c-coral{fill:var(--co-f);stroke:var(--co-s)}.c-coral .th{fill:var(--co-t)}.c-coral .ts{fill:var(--co-s)}
.c-red{fill:var(--re-f);stroke:var(--re-s)}
.c-purple text,.c-teal text,.c-gray text,.c-coral text{stroke:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px}
</style>
</head>
<body>
<noscript><p style="padding:16px">Für die Animation muss JavaScript aktiviert sein.</p></noscript>
<div id="err" style="display:none;background:#fbdada;color:#7d1c1c;padding:12px 16px;font:15px system-ui"></div>
<div class="wrap">
<h1>Blutzucker-Simulation</h1>
<p class="lead">Wähle oben, ob der Körper gesund ist oder Diabetes hat. Drücke dann auf „Mahlzeit essen“ und schau zu.</p>

<div class="bar">
  <button data-m="gesund">Gesund</button>
  <button data-m="t1">Diabetes Typ 1</button>
  <button data-m="t2">Diabetes Typ 2</button>
</div>
<div class="bar">
  <button id="eat">Mahlzeit essen</button>
  <button id="sport">Sport treiben</button>
  <button id="shot" style="display:none">Insulin spritzen</button>
  <span class="sp"></span>
  <button id="reset">Neustart</button>
</div>

<div class="top">
  <div class="tile">
    <small>Blutzucker</small>
    <div class="num"><span id="gv" style="font-size:28px;font-weight:700;color:var(--text-primary)">90</span> <span>mg/dl</span></div>
    <div id="badge">Normal</div>
  </div>
  <div id="msg" class="tile"></div>
</div>

<div class="card">
<svg viewBox="0 0 680 352" role="img">
  <title>Blutbahn mit Zucker und Insulin, Bauchspeicheldrüse, Leber und Körperzelle</title>
  <desc>Zuckerteilchen schwimmen in der Blutbahn. Insulin-Schlüssel öffnen die Türen der Körperzelle, damit Zucker hineingelangt. Beim Sport nehmen die Muskeln zusätzlich Zucker auf.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <g id="pan" class="c-purple">
    <rect x="30" y="20" width="200" height="60" rx="8" stroke-width="0.8"/>
    <text class="th" x="130" y="40" text-anchor="middle" dominant-baseline="central">Bauchspeicheldrüse</text>
    <text id="panT" class="ts" x="130" y="62" text-anchor="middle" dominant-baseline="central">ruht</text>
  </g>
  <g id="liv" class="c-teal">
    <rect x="450" y="20" width="200" height="60" rx="8" stroke-width="0.8"/>
    <text class="th" x="550" y="40" text-anchor="middle" dominant-baseline="central">Leber</text>
    <text id="livT" class="ts" x="550" y="62" text-anchor="middle" dominant-baseline="central">Zuckerspeicher</text>
  </g>
  <line id="panArr" x1="130" y1="82" x2="130" y2="126" style="stroke:#7F77DD;stroke-width:2;opacity:.15" marker-end="url(#arrow)"/>
  <text id="panLab" class="ts" x="142" y="108" style="opacity:0">Insulin</text>
  <line id="livArr" x1="550" y1="82" x2="550" y2="126" style="stroke:#BA7517;stroke-width:2;opacity:.15" marker-end="url(#arrow)"/>
  <text id="livLab" class="ts" x="562" y="108" style="opacity:0">Zucker raus</text>

  <rect class="c-red" x="30" y="130" width="620" height="60" rx="30" stroke-width="0.8"/>
  <text class="ts" x="40" y="212">Blutbahn</text>

  <g id="keysG"></g>
  <g id="dotsG"></g>

  <rect id="cellR" class="c-gray" x="180" y="240" width="320" height="76" rx="12" stroke-width="0.8"/>
  <text class="th" x="340" y="276" text-anchor="middle" dominant-baseline="central">Körperzelle</text>
  <text id="cellT" class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">Zucker = Energie</text>
  <g id="doors">
    <rect x="230" y="236" width="34" height="8" rx="2" fill="#888780"/>
    <rect x="295" y="236" width="34" height="8" rx="2" fill="#888780"/>
    <rect x="360" y="236" width="34" height="8" rx="2" fill="#888780"/>
    <rect x="425" y="236" width="34" height="8" rx="2" fill="#888780"/>
  </g>
  <g id="entG"></g>
  <text id="doorTxt" class="ts" x="510" y="244">Türen: 0 von 4 offen</text>

  <circle cx="44" cy="338" r="4.5" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text class="ts" x="56" y="342">Zucker</text>
  <g transform="translate(150,338)"><circle r="3.5" fill="#7F77DD"/><path d="M3 0H10M8 0V3M10.5 0V3" stroke="#7F77DD" stroke-width="1.5" fill="none"/></g>
  <text class="ts" x="168" y="342">Insulin (Schlüssel)</text>
  <rect x="300" y="334" width="26" height="8" rx="2" fill="#888780"/>
  <text class="ts" x="332" y="342">Tür zu</text>
  <rect x="390" y="334" width="8" height="8" rx="2" fill="#1D9E75"/>
  <text class="ts" x="404" y="342">Tür offen</text>
</svg>
</div>

<div class="card">
<svg viewBox="0 0 680 215" role="img">
  <title>Verlauf des Blutzuckers über die Zeit</title>
  <desc>Kurve des Blutzuckerspiegels in mg/dl mit grünem Normalbereich.</desc>
  <rect x="50" y="108.5" width="610" height="43" style="fill:var(--bg-success)"/>
  <text class="ts" x="655" y="145" text-anchor="end">Normalbereich</text>
  <line x1="50" y1="83.8" x2="660" y2="83.8" class="leader"/>
  <text class="ts" x="56" y="78">ab 180: Zucker im Urin</text>
  <line x1="50" y1="10" x2="50" y2="170" stroke="var(--border-strong)" stroke-width="0.5"/>
  <line x1="50" y1="170" x2="660" y2="170" stroke="var(--border-strong)" stroke-width="0.5"/>
  <text class="ts" x="44" y="155" text-anchor="end">70</text>
  <text class="ts" x="44" y="112" text-anchor="end">140</text>
  <text class="ts" x="44" y="88" text-anchor="end">180</text>
  <text class="ts" x="4" y="14">mg/dl</text>
  <text class="ts" x="660" y="186" text-anchor="end">Zeit →</text>
  <g id="ev"></g>
  <path id="refl" d="" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" style="display:none"/>
  <path id="line" d="" fill="none" stroke="#378ADD" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="50" y1="203" x2="72" y2="203" stroke="#378ADD" stroke-width="2.5"/>
  <text class="ts" x="78" y="207">Blutzucker</text>
  <g id="refleg" style="display:none">
    <line x1="170" y1="203" x2="192" y2="203" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="ts" x="198" y="207">zum Vergleich: gesunder Körper</text>
  </g>
</svg>
</div>
</div>

<script>
window.onerror=function(m,u,l){var e=document.getElementById("err");if(!e)return;e.style.display="block";e.textContent="Fehler in der Animation: "+m+" (Zeile "+l+") | "+navigator.userAgent;};
</script>
<script>
(function(){
"use strict";
const K0=0.004,TAU=35,D=0.03,M=330,SPK=0.005,SPD=50;
const P={gesund:{ki:0.004,b:0.004},t1:{ki:0.004,b:0},t2:{ki:0.0012,b:0.004}};
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
let mode='gesund',t,main,ref,meals,events,hist,dots,keys,ents,acc,last,sportUntil;

function mk(p){return {G:90,I:1,p:p,Lp:(K0+p.ki*1)*90};}
function step(s,tt){
  let R=0;
  for(const m of meals){const u=tt-m;if(u>=0)R+=M*u/(TAU*TAU)*Math.exp(-u/TAU);}
  const gl=s.G<85?(85-s.G)*0.015:0;
  const sp=tt<sportUntil?SPK:0;
  const dG=s.Lp+R+gl-(K0+s.p.ki*s.I+sp)*s.G;
  const dI=s.p.b*Math.max(0,s.G-90)-D*(s.I-1);
  s.G=Math.max(40,s.G+dG);
  s.I=Math.max(0.2,s.I+dI);
}
function yy(g){return 170-(Math.min(300,Math.max(40,g))-40)*0.6154;}

function init(){
  t=0;acc=0;meals=[];events=[];hist=[];sportUntil=-1;
  main=mk(P[mode]);ref=mk(P.gesund);
  ['dotsG','keysG','entG'].forEach(i=>$(i).innerHTML='');
  dots=[];keys=[];ents=[];
  hist.push([0,90,90]);
  $('shot').style.display=mode==='t1'?'inline-block':'none';
  $('refl').style.display=mode==='gesund'?'none':'block';
  $('refleg').style.display=mode==='gesund'?'none':'block';
  document.querySelectorAll('button[data-m]').forEach(b=>{
    const on=b.dataset.m===mode;
    b.style.background=on?'var(--bg-accent)':'';
    b.style.color=on?'var(--text-accent)':'';
    b.style.borderColor=on?'var(--border-accent)':'';
  });
}

function addDot(){
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('r','4.5');c.setAttribute('fill','#EF9F27');c.setAttribute('stroke','#854F0B');c.setAttribute('stroke-width','0.5');
  $('dotsG').appendChild(c);
  dots.push({el:c,x:40+Math.random()*600,b:142+Math.random()*36,v:0.5+Math.random()*0.6,ph:Math.random()*20});
}
function addKey(){
  const g=document.createElementNS(NS,'g');
  g.innerHTML='<circle r="3.5" fill="#7F77DD"/><path d="M3 0H10M8 0V3M10.5 0V3" stroke="#7F77DD" stroke-width="1.5" fill="none"/>';
  $('keysG').appendChild(g);
  keys.push({el:g,x:40+Math.random()*580,b:142+Math.random()*36,v:0.35+Math.random()*0.4,ph:Math.random()*20});
}
function move(a){
  a.x+=a.v;if(a.x>630)a.x=40;
  return a.b+Math.sin((a.x+a.ph)/18)*4;
}

function particles(){
  const sporting=t<sportUntil;
  const N=Math.round(main.G/6.5),Kc=Math.min(16,Math.round(main.I*1.3));
  while(dots.length<N)addDot();
  while(dots.length>N){dots.pop().el.remove();}
  while(keys.length<Kc)addKey();
  while(keys.length>Kc){keys.pop().el.remove();}
  for(const d of dots){const y=move(d);d.el.setAttribute('cx',d.x.toFixed(1));d.el.setAttribute('cy',y.toFixed(1));}
  for(const k of keys){const y=move(k);k.el.setAttribute('transform','translate('+k.x.toFixed(1)+','+y.toFixed(1)+')');}

  const x=Math.min(1,P[mode].ki*main.I/0.028);
  let open=Math.floor(4*x+0.3);
  if(sporting)open=Math.max(open,3);
  const rects=$('doors').children;
  for(let i=0;i<4;i++){
    const r=rects[i],cx=[230,295,360,425][i];
    if(i<open){r.setAttribute('width','8');r.setAttribute('fill','#1D9E75');}
    else{r.setAttribute('width','34');r.setAttribute('fill','#888780');}
    r.setAttribute('x',cx);
  }
  $('doorTxt').textContent='Türen: '+open+' von 4 offen';
  $('cellR').setAttribute('class',sporting?'c-coral':'c-gray');
  $('cellT').textContent=sporting?'Muskeln arbeiten':'Zucker = Energie';
  const rate=sporting?0.07:0.035;
  for(let i=0;i<open;i++){
    if(Math.random()<rate*(main.G/100)){
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('r','4');c.setAttribute('fill','#EF9F27');c.setAttribute('stroke','#854F0B');c.setAttribute('stroke-width','0.5');
      c.setAttribute('cx',[230,295,360,425][i]+17);
      $('entG').appendChild(c);
      ents.push({el:c,y:192,cx:[230,295,360,425][i]+17,age:0});
    }
  }
  for(let i=ents.length-1;i>=0;i--){
    const e=ents[i];
    if(e.y<268)e.y+=1.8;else e.age++;
    e.el.setAttribute('cy',e.y.toFixed(1));
    e.el.setAttribute('opacity',Math.max(0,1-e.age/30).toFixed(2));
    if(e.age>30){e.el.remove();ents.splice(i,1);}
  }
}

function organs(){
  const producing=main.p.b>0&&main.G>92;
  if(mode==='t1'){
    $('pan').setAttribute('class','c-gray');
    $('panT').textContent='macht kein Insulin';
  }else{
    $('pan').setAttribute('class','c-purple');
    $('panT').textContent=producing?'macht Insulin':'ruht';
  }
  $('panArr').style.opacity=producing?1:0.12;
  $('panLab').style.opacity=producing?1:0;
  const rel=main.G<85;
  $('livArr').style.opacity=rel?1:0.12;
  $('livLab').style.opacity=rel?1:0;
  $('livT').textContent=rel?'gibt Zucker ab':(main.I>2.5&&main.G>100?'speichert Zucker':'Zuckerspeicher');
}

function updateStatus(){
  const G=main.G,I=main.I,sporting=t<sportUntil;
  let label='Normal',kind='success',txt;
  if(G<70){label='Unterzucker';kind='danger';txt='Zu wenig Zucker im Blut: Man wird zittrig und schwach. Die Leber gibt Zucker ab. Jetzt schnell etwas Süßes essen.';}
  else if(sporting){
    if(G>180){label='Viel zu hoch';kind='danger';}else if(G>140){label='Zu hoch';kind='warning';}
    txt='Sport: Die Muskeln brauchen Energie und nehmen Zucker auf, auch ohne viel Insulin. Der Blutzucker sinkt.';}
  else if(G>180){label='Viel zu hoch';kind='danger';
    txt=mode==='t1'?'Es ist kein Insulin da, die Türen bleiben zu. Der Zucker staut sich im Blut und geht in den Urin über. Jetzt Insulin spritzen oder Sport treiben!'
      :mode==='t2'?'Insulin ist da, aber die Türen reagieren kaum darauf. Der Zucker bleibt lange hoch. Sport hilft.'
      :'Der Zucker ist stark gestiegen.';}
  else if(G>140){label='Zu hoch';kind='warning';
    txt=mode==='t1'?'Kein Insulin, keine offenen Türen: Der Zucker bleibt im Blut. Insulin spritzen oder Sport treiben hilft.'
      :mode==='t2'?'Die Bauchspeicheldrüse macht Insulin, aber die Türen öffnen sich nur schlecht. Der Zucker sinkt nur langsam.'
      :'Nach dem Essen steigt der Zucker. Die Bauchspeicheldrüse schickt Insulin los, die Türen öffnen sich.';}
  else if(I>2.5){txt='Das Insulin hat die Türen geöffnet: Der Zucker wandert in die Zellen und der Blutzucker sinkt.';}
  else txt='Alles im grünen Bereich: etwa 90 mg/dl. Drück auf „Mahlzeit essen“ oder „Sport treiben“.';
  $('gv').textContent=Math.round(G);
  const b=$('badge');b.textContent=label;
  b.style.background='var(--bg-'+kind+')';b.style.color='var(--text-'+kind+')';
  if($('msg').textContent!==txt)$('msg').textContent=txt;
}

function chart(){
  const tS=Math.max(0,t-240);
  let d='',r='';
  hist.forEach((h,i)=>{
    const x=(50+(h[0]-tS)/240*610).toFixed(1);
    d+=(i?'L':'M')+x+' '+yy(h[1]).toFixed(1);
    r+=(i?'L':'M')+x+' '+yy(h[2]).toFixed(1);
  });
  $('line').setAttribute('d',d);
  $('refl').setAttribute('d',r);
  let ev='';
  const names={eat:'Essen',shot:'Spritze',sport:'Sport'};
  for(const e of events){
    if(e.t<tS)continue;
    const x=(50+(e.t-tS)/240*610).toFixed(1);
    ev+='<line x1="'+x+'" y1="10" x2="'+x+'" y2="170" stroke="var(--text-muted)" stroke-width="0.5" stroke-dasharray="3 3"/>'
      +'<text class="ts" x="'+(x-3)+'" y="22" text-anchor="end">'+names[e.type]+'</text>';
    if(e.type==='sport'){
      const x2=(50+(Math.min(e.t+SPD,t)-tS)/240*610).toFixed(1);
      ev+='<rect x="'+x+'" y="166" width="'+Math.max(0,x2-x).toFixed(1)+'" height="4" fill="#D85A30"/>';
    }
  }
  $('ev').innerHTML=ev;
}

function frame(now){
  const dt=Math.min(100,now-last);last=now;acc+=dt;
  while(acc>=30){
    acc-=30;t++;
    step(main,t);step(ref,t);
    hist.push([t,main.G,ref.G]);
    if(hist.length>242)hist.shift();
  }
  particles();organs();updateStatus();chart();
  requestAnimationFrame(frame);
}

document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;init();});
$('eat').onclick=()=>{meals.push(t+1);events.push({t:t,type:'eat'});};
$('sport').onclick=()=>{sportUntil=t+SPD;events.push({t:t,type:'sport'});};
$('shot').onclick=()=>{main.I+=5;events.push({t:t,type:'shot'});};
$('reset').onclick=()=>init();

init();
last=performance.now();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
